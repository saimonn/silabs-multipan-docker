version: "3.9"
services:
  multipan:
    image: silabs-multipan-docker:oci-from-scratch
    build: .
    container_name: multipan
    restart: unless-stopped
    privileged: true # required: access to the USB dongle + ip6tables/ipset
    network_mode: host # required: otbr firewall + mDNS
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    volumes:
      - ./multipan/:/data # keeps your Zigbee + Thread network state
    environment:
      # Dongle connection
      DEVICE: "/dev/ttyUSB0" # your multiprotocol dongle
      BAUDRATE: "460800"
      FLOW_CONTROL: "true" # SkyConnect/500-series dongles in the USB form
      CPCP_DISABLE_ENCRYPTION: "true" # keep it: we speak CPC protocol v5

      # Thread / OpenThread Border Router
      BACKBONE_IF: "eth0" # your WAN/LAN interface used by the Border Router
      OTBR_REST_LISTEN_PORT: "8081" # Home Assistant OTBR integration URL
      OTBR_WEB_PORT: "8086" # Web GUI (create/reset the Thread network here)

      # Zigbee daemon
      EZSP_LISTEN_PORT: "9999" # Home Assistant ZHA radio URL port